[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackmty-decision-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai-agents",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["DecisionAgent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
